<svg width="100%" viewBox="0 0 780 260" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Tripwire logo — Option B refined v5</title>

  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="60%" style="stop-color:#b0b0b0"/>
      <stop offset="100%" style="stop-color:#787878"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a"/>
      <stop offset="100%" style="stop-color:#111"/>
    </linearGradient>
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8c8c8"/>
      <stop offset="100%" style="stop-color:#707070"/>
    </linearGradient>
  </defs>

  <!-- ANTENNA -->
  <line x1="188" y1="62" x2="188" y2="86" stroke="#aaa" stroke-width="2.5" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(170, 170, 170);color:rgb(255, 255, 255);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="188" cy="56" r="6" fill="#3a0a0a" stroke="#cc3333" stroke-width="1.5" opacity="0.7" style="fill:rgb(58, 10, 10);stroke:rgb(204, 51, 51);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="188" cy="56" r="2.5" fill="#cc3333" opacity="0.5" style="fill:rgb(204, 51, 51);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- LEFT ear nub -->
  <rect x="126" y="104" width="10" height="22" rx="3" fill="url(#earGrad)" stroke="#666" stroke-width="0.8" style="stroke:rgb(102, 102, 102);color:rgb(255, 255, 255);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- RIGHT ear nub -->
  <rect x="238" y="104" width="10" height="22" rx="3" fill="url(#earGrad)" stroke="#666" stroke-width="0.8" style="stroke:rgb(102, 102, 102);color:rgb(255, 255, 255);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- main head -->
  <rect x="136" y="86" width="102" height="78" rx="14" fill="url(#bodyGrad)" stroke="#666" stroke-width="1" style="stroke:rgb(102, 102, 102);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- face screen inset -->
  <rect x="148" y="96" width="78" height="56" rx="8" fill="url(#faceGrad)" stroke="#444" stroke-width="0.8" style="stroke:rgb(68, 68, 68);color:rgb(255, 255, 255);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Eyes: gentle downward arc, less curved than v1, closer together like v4 -->
  <path d="M164 120 Q170 116 176 120" fill="none" stroke="#888" stroke-width="2.5" stroke-linecap="round" style="fill:none;stroke:rgb(136, 136, 136);color:rgb(255, 255, 255);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <path d="M198 120 Q204 116 210 120" fill="none" stroke="#888" stroke-width="2.5" stroke-linecap="round" style="fill:none;stroke:rgb(136, 136, 136);color:rgb(255, 255, 255);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- STRAIGHT mouth -->
  <line x1="171" y1="139" x2="203" y2="139" stroke="#555" stroke-width="1.5" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(85, 85, 85);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- bottom vent lines -->
  <line x1="160" y1="147" x2="166" y2="147" stroke="#444" stroke-width="1" stroke-linecap="round" opacity="0.6" style="fill:rgb(0, 0, 0);stroke:rgb(68, 68, 68);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="172" y1="147" x2="178" y2="147" stroke="#444" stroke-width="1" stroke-linecap="round" opacity="0.6" style="fill:rgb(0, 0, 0);stroke:rgb(68, 68, 68);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="184" y1="147" x2="190" y2="147" stroke="#444" stroke-width="1" stroke-linecap="round" opacity="0.6" style="fill:rgb(0, 0, 0);stroke:rgb(68, 68, 68);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="196" y1="147" x2="202" y2="147" stroke="#444" stroke-width="1" stroke-linecap="round" opacity="0.6" style="fill:rgb(0, 0, 0);stroke:rgb(68, 68, 68);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="208" y1="147" x2="214" y2="147" stroke="#444" stroke-width="1" stroke-linecap="round" opacity="0.6" style="fill:rgb(0, 0, 0);stroke:rgb(68, 68, 68);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ZZZ ascending off antenna -->
  <text x="196" y="68" font-family="Georgia, serif" font-size="11" fill="#777" font-weight="600" opacity="0.5" style="fill:rgb(119, 119, 119);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:Georgia, serif;font-size:11px;font-weight:600;text-anchor:start;dominant-baseline:auto">z</text>
  <text x="205" y="56" font-family="Georgia, serif" font-size="15" fill="#999" font-weight="600" opacity="0.7" style="fill:rgb(153, 153, 153);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.7;font-family:Georgia, serif;font-size:15px;font-weight:600;text-anchor:start;dominant-baseline:auto">z</text>
  <text x="217" y="43" font-family="Georgia, serif" font-size="19" fill="#bbb" font-weight="600" style="fill:rgb(187, 187, 187);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:19px;font-weight:600;text-anchor:start;dominant-baseline:auto">Z</text>

  <!-- WORDMARK -->
  <text x="268" y="155" font-family="'Times New Roman', Georgia, serif" font-size="72" font-weight="400" letter-spacing="1" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Times New Roman&quot;, Georgia, serif;font-size:72px;font-weight:400;text-anchor:start;dominant-baseline:auto">
    <tspan fill="#c8c8c8" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Times New Roman&quot;, Georgia, serif;font-size:72px;font-weight:400;text-anchor:start;dominant-baseline:auto">TRIP</tspan><tspan fill="#cc2222" style="fill:rgb(204, 34, 34);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Times New Roman&quot;, Georgia, serif;font-size:72px;font-weight:400;text-anchor:start;dominant-baseline:auto">WIRE</tspan>
  </text>

</svg>